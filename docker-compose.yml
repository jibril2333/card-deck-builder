services:
  app:
    build: .
    image: card-deck-builder:prod
    container_name: card-deck-builder
    restart: unless-stopped
    # Run as the host owner (uid 501 / gid 20 = staff on this Mac) so the
    # bind-mounted SQLite DBs — owned by that user — are writable. The image's
    # built-in `nextjs` (1001) user could only READ them, so deck edits /
    # purchases / scraper writes would silently fail.
    user: "501:20"
    ports:
      - "3001:3001"
    environment:
      # Who may open /[game]/admin and trigger a card-data refresh. The app is
      # public through the tunnel and accounts go to friends, so this is an
      # explicit allowlist rather than "any logged-in user". Unset = nobody.
      CDB_ADMIN_EMAILS: "${CDB_ADMIN_EMAILS:-}"
    # The image has no curl/wget (node:22-bookworm-slim), so probe with node's
    # global fetch. /api/health reads a row from BOTH SQLite files, so this
    # reports unhealthy on DB corruption too — not just on a dead port.
    # NOTE: Docker does not restart a merely-unhealthy container on its own;
    # this drives `docker ps` status and the CI deploy gate.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      # Bind-mount the real SQLite DBs (decks/collection/accounts + card
      # data) so they persist across image rebuilds/redeploys. NEVER put
      # this in the image — data.nosync is gitignored and holds personal
      # data; the repo is public.
      #
      # CDB_DATA_DIR MUST be an absolute host path in CI: the GitHub Actions
      # runner runs `docker compose up` from its own checkout dir (which has
      # no data.nosync), so a relative `./data.nosync` would mount an empty
      # dir and the app would 500 with "数据库文件不存在". The workflow sets
      # it to $HOME/card-deck-builder/data.nosync. For local runs from the
      # project root, the default `./data.nosync` resolves correctly.
      - ${CDB_DATA_DIR:-./data.nosync}:/app/data.nosync
      # Litestream's local replica — see docker-compose.nas.yml.
      - ${CDB_BACKUP_DIR:-./data.nosync/litestream}:/app/backups
