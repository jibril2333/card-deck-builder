# Running the app on the TrueNAS box.
#
# Differs from docker-compose.yml in one decisive way: it does NOT build. The
# image comes from GHCR, built for linux/amd64 by .github/workflows/image.yml
# on GitHub's runners. Nothing in this repo executes on the NAS — it pulls a
# finished image, which is the whole reason this arrangement is safer than
# putting a second self-hosted runner on the machine that holds your storage.
#
# Usage on the NAS (TrueNAS SCALE ≥ 24.10 has Docker natively; in the UI this
# goes in Apps → Discover → Custom App → "Install via YAML"):
#
#   CDB_DATA_DIR=/mnt/<pool>/<dataset>/card-deck-builder \
#   CDB_UID=<owner uid> CDB_GID=<owner gid> \
#     docker compose -f docker-compose.nas.yml up -d
#
#   docker compose -f docker-compose.nas.yml pull && \
#   docker compose -f docker-compose.nas.yml up -d      # take a new build
#
# An empty data directory is fine: the entrypoint builds the database, and the
# refresh daemon fills it with cards on the schedule. To not wait for that:
#
#   docker exec card-deck-builder \
#     node /app/scripts-dist/refresh-daemon.js --once cards sets text art
#
# ⚠️ CDB_DATA_DIR MUST be a local ZFS dataset. Never an NFS/SMB share, and
# never a path that lives on another machine: SQLite coordinates writers with
# POSIX locks, and network filesystems do not implement them faithfully. That
# is the same class of bug as the macOS bind-mount corruption recorded in
# AGENTS.md, except a network share loses the argument outright.
services:
  app:
    image: ghcr.io/jibril2333/card-deck-builder:latest
    container_name: card-deck-builder
    restart: unless-stopped
    labels:
      # Watchtower only touches containers carrying this label (it runs with
      # --label-enable below), so nothing else on the NAS can be restarted by
      # a registry poll.
      com.centurylinklabs.watchtower.enable: "true"
    # Must match the owner of CDB_DATA_DIR on the NAS, or every write (deck
    # edits, refreshes) fails silently — the image's built-in nextjs user
    # (1001) would only be able to read. TrueNAS apps commonly run as 568:568
    # (`apps`); check with `ls -n` on the dataset before setting this.
    user: "${CDB_UID:-568}:${CDB_GID:-568}"
    ports:
      - "${CDB_PORT:-3001}:3001"
    # Zombie reaping: the entrypoint keeps two daemons alive next to the
    # server, and PID 1 (the server) does not reap the children they leave.
    init: true
    environment:
      # The refresh schedule is arithmetic in LOCAL time, and a container's
      # local time is UTC unless this is set — "04:30" in the settings page
      # would then be 13:30 here. Node reads TZ directly.
      TZ: "${CDB_TZ:-Asia/Tokyo}"
      CDB_ADMIN_EMAILS: "${CDB_ADMIN_EMAILS:-}"
      # Run the card-data refresh inside this container: the schedule from the
      # admin page, and the 立即更新 button. Correct HERE and wrong on the Mac
      # — see scripts/refresh-daemon.ts for why the two hosts differ.
      CDB_REFRESH_IN_CONTAINER: "1"
    healthcheck:
      # No curl/wget in node:22-bookworm-slim; /api/health reads a row from
      # BOTH SQLite files, so this reports unhealthy on DB corruption too.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - ${CDB_DATA_DIR:?set CDB_DATA_DIR to the dataset holding the SQLite files}:/app/data.nosync
      # Litestream's local replica. Point this at a DIFFERENT dataset from the
      # one above: a copy that dies with the thing it is copying is decoration.
      # The off-site copy (R2) is configured in the settings page, not here.
      #
      # Writable by the uid this container runs as — `user:` above, i.e.
      # CDB_UID/CDB_GID (568 = TrueNAS's own apps user), NOT the 1001 baked
      # into the image. A freshly created dataset belongs to root and
      # Litestream then fails every sync with `mkdir …: permission denied`:
      #   chown -R "${CDB_UID:-568}:${CDB_GID:-568}" "$CDB_BACKUP_DIR"
      - ${CDB_BACKUP_DIR:-cdb-backups}:/app/backups

  # Takes a new build without anything reaching into the NAS from outside.
  #
  # The alternative — a GitHub Actions self-hosted runner on the NAS — was
  # rejected on purpose: this repo is public, and a runner executes whatever a
  # workflow says on the machine that holds your storage. Here the traffic is
  # outbound only: watchtower asks GHCR whether the digest moved, and if it
  # did, pulls and recreates the one container carrying the label above.
  #
  # It needs the Docker socket, which is a real privilege — but it is NAS
  # admin tooling, not the internet-facing app. The app itself still has no
  # socket, which is the property that matters.
  watchtower:
    image: containrrr/watchtower
    container_name: cdb-watchtower
    restart: unless-stopped
    # Behind a profile so the app can be brought up on its own:
    #
    #   docker compose -f docker-compose.nas.yml up -d                    # app only
    #   docker compose -f docker-compose.nas.yml --profile auto-update up -d
    #
    # Without this the required token below would refuse to start ANYTHING,
    # which is the wrong order — you want the site serving and verified before
    # you wire up something that can restart it.
    profiles: ["auto-update"]
    # Two ways in, and they cover each other:
    #   · --interval: the poll. Still there so a deploy isn't lost when the
    #     NAS was down at the moment CI called.
    #   · --http-api-update: an endpoint that updates NOW. GitHub Actions calls
    #     it at the end of a build, over Tailscale — see .github/workflows.
    #
    # The endpoint is NOT published to the internet: no port forward, nothing
    # on the Cloudflare tunnel. It is reachable from the LAN and from the
    # tailnet, and the token is what authorises the call. Note what CI can and
    # cannot do with it: ask watchtower to pull labelled images. Not a shell,
    # not SSH, not the Docker socket — that stays inside this container.
    command: >-
      --label-enable --cleanup
      --interval ${CDB_WATCH_INTERVAL:-3600}
      --http-api-update --http-api-periodic-polls
    environment:
      WATCHTOWER_HTTP_API_TOKEN: "${CDB_WATCHTOWER_TOKEN:?set a long random token; GitHub Actions sends it}"
    ports:
      - "${CDB_WATCHTOWER_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# A NAMED volume, not a host path, as the default: a fresh named volume takes
# the image directory's mode with it (1777), so it is writable whatever uid
# `user:` runs this container as, and nobody has to chown anything. Set
# CDB_BACKUP_DIR to a real path (a different dataset from the databases) to
# keep the copy somewhere you can snapshot — and chown that path to the same
# uid:gid as `user:` when you do.
volumes:
  cdb-backups:
