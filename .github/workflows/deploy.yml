name: Deploy to Docker

# SECURITY: this job runs on a SELF-HOSTED runner (the owner's own Mac, the
# same machine that serves the app). It must NEVER trigger on pull_request /
# pull_request_target — those events run untrusted contributor code and would
# hand arbitrary code execution to anyone opening a PR against this public
# repo. `push` to `main` is safe because only the repo owner has push access
# (verified: sole collaborator, admin). Do not broaden the trigger without
# re-checking collaborator/branch-protection state.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cdb]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Put Docker Desktop's bin on PATH
        # The host's ~/.docker/config.json sets `credsStore: "desktop"`, so
        # BuildKit shells out to `docker-credential-desktop` even for ANONYMOUS
        # pulls of public images. That binary (and the docker CLI itself) lives
        # in Docker.app and is NOT on the self-hosted runner's minimal PATH, so
        # the build dies at "load metadata for node:22-bookworm-slim". Add that
        # dir to PATH so the helper resolves. (We deliberately do NOT override
        # DOCKER_CONFIG — the `docker compose` CLI plugin is discovered via the
        # default ~/.docker/cli-plugins, and pointing DOCKER_CONFIG elsewhere
        # loses it → "unknown command: docker compose".)
        run: echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Build image
        run: docker compose build

      - name: Deploy (recreate container with the new image)
        # The runner checks the repo out to its own _work dir, which has no
        # data.nosync (gitignored). Mount the real DBs from the project dir by
        # absolute path so the container sees the owner's actual data.
        run: |
          # Host-only deploy config (admin allowlist etc). It lives outside the
          # repo — this is a public repo, and the runner checks out into its
          # own _work dir where a project-local .env wouldn't be visible anyway.
          if [ -f "$HOME/card-deck-builder/.env.deploy" ]; then
            set -a; . "$HOME/card-deck-builder/.env.deploy"; set +a
          fi
          CDB_DATA_DIR="$HOME/card-deck-builder/data.nosync" \
            docker compose up -d --remove-orphans

      - name: Wait for health check
        # /api/health reads a row from both SQLite files, so a green gate means
        # the DB is actually usable — not just that the port is open.
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3001/api/health > /dev/null; then
              echo "app responding"; ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "app did not become healthy in time" >&2
            docker compose logs --tail=100
            exit 1
          fi
          # Also confirm Docker's own healthcheck agrees, so a broken
          # healthcheck definition fails the deploy instead of silently
          # leaving every future container stuck in "starting".
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' card-deck-builder 2>/dev/null || echo none)
            case "$s" in
              healthy) echo "docker health: healthy"; exit 0 ;;
              unhealthy) echo "docker reports unhealthy" >&2
                         docker inspect -f '{{json .State.Health}}' card-deck-builder >&2
                         exit 1 ;;
            esac
            sleep 2
          done
          echo "docker health never left '$s'" >&2
          docker inspect -f '{{json .State.Health}}' card-deck-builder >&2
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
