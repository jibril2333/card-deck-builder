name: Build image (GHCR)

# Builds the image on GitHub's own runners — one job per architecture, each on
# a machine of that architecture — and publishes a multi-arch tag to GHCR, so a
# machine that is NOT this Mac (the TrueNAS box, an Apple Silicon laptop) can
# run the app by pulling rather than by building.
#
# SECURITY, and the reason this is not simply "another self-hosted runner":
# the repo is public. deploy.yml already runs on a self-hosted runner, and is
# safe only because `push` to main is owner-only (see its header). Putting a
# second self-hosted runner on the NAS would make every workflow change a
# potential foothold on the box that holds the household's storage. Here the
# NAS never executes anything from this repo — it pulls an image. The blast
# radius stays inside GitHub's runner.
#
# Runs on every push to main, so the NAS deployment tracks the repo the same
# way the Mac one does. Documentation-only commits are skipped — the image
# wouldn't differ.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: latest

concurrency:
  group: ghcr-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each architecture on a machine of that architecture. The previous shape —
  # one x86 runner building both halves through QEMU — took 9 to 13 minutes,
  # nearly all of it emulating arm64 while `npm ci` compiled better-sqlite3
  # from source because no prebuilt binary matches an emulated target.
  #
  # GitHub's arm64 runners are free for public repositories, which is why this
  # doesn't need a self-hosted machine: the Mac could build arm64 natively too,
  # but it's the machine this whole exercise is trying to stop depending on,
  # and it has to be awake.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, without a tag: neither half is the image on its own,
      # and tagging both would leave whichever finished last as `latest` — a
      # single-architecture image wearing a multi-architecture name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate cache per architecture; one shared ref would have the two
          # jobs overwriting each other's layers on every run.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          # The filename IS the digest; the merge job turns the set of names
          # back into `image@sha256:…` references.
          touch "/tmp/digests/$(echo '${{ steps.build.outputs.digest }}' | sed 's|sha256:||')"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # The tag people actually pull points at a manifest LIST naming both digests.
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        run: |
          cd /tmp/digests
          TAG="${{ inputs.tag || 'latest' }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:$TAG" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:$TAG"
