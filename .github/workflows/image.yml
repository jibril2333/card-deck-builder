name: Build image (GHCR)

# Builds the image on GitHub's own runners — one job per architecture, each on
# a machine of that architecture — and publishes a multi-arch tag to GHCR, so a
# machine that is NOT this Mac (the TrueNAS box, an Apple Silicon laptop) can
# run the app by pulling rather than by building.
#
# SECURITY, and the reason this is not simply "another self-hosted runner":
# the repo is public. deploy.yml already runs on a self-hosted runner, and is
# safe only because `push` to main is owner-only (see its header). Putting a
# second self-hosted runner on the NAS would make every workflow change a
# potential foothold on the box that holds the household's storage. Here the
# NAS never executes anything from this repo — it pulls an image. The blast
# radius stays inside GitHub's runner.
#
# Runs on every push to main, so the NAS deployment tracks the repo the same
# way the Mac one does. Documentation-only commits are skipped — the image
# wouldn't differ.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: latest

concurrency:
  group: ghcr-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each architecture on a machine of that architecture. The previous shape —
  # one x86 runner building both halves through QEMU — took 9 to 13 minutes,
  # nearly all of it emulating arm64 while `npm ci` compiled better-sqlite3
  # from source because no prebuilt binary matches an emulated target.
  #
  # GitHub's arm64 runners are free for public repositories, which is why this
  # doesn't need a self-hosted machine: the Mac could build arm64 natively too,
  # but it's the machine this whole exercise is trying to stop depending on,
  # and it has to be awake.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, without a tag: neither half is the image on its own,
      # and tagging both would leave whichever finished last as `latest` — a
      # single-architecture image wearing a multi-architecture name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate cache per architecture; one shared ref would have the two
          # jobs overwriting each other's layers on every run.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          # The filename IS the digest; the merge job turns the set of names
          # back into `image@sha256:…` references.
          touch "/tmp/digests/$(echo '${{ steps.build.outputs.digest }}' | sed 's|sha256:||')"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # The tag people actually pull points at a manifest LIST naming both digests.
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        run: |
          cd /tmp/digests
          TAG="${{ inputs.tag || 'latest' }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:$TAG" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:$TAG"

  # Tell the NAS to take the new image, over Tailscale.
  #
  # Why Tailscale rather than a public webhook: the NAS has no inbound exposure
  # and this doesn't add any. The runner joins the tailnet as an EPHEMERAL,
  # TAGGED node for the length of the job and disappears; ACLs decide what
  # tag:ci may reach, so the blast radius is one port on one host rather than
  # "the internet can ask my NAS to do things".
  #
  # Why not SSH: the call below is the whole capability — "pull the labelled
  # images and recreate them". CI never gets a shell on the box, and the Docker
  # socket stays inside watchtower's container. A stolen token replays a
  # deployment; a stolen SSH key is the NAS.
  #
  # Unconfigured is not a failure: until the secrets exist this job no-ops and
  # the poll (watchtower --interval) picks the image up on its own. Nobody
  # should get a red build for not having finished a network setup.
  deploy-nas:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Are the secrets there?
        id: check
        run: |
          if [ -n "${{ secrets.TS_OAUTH_CLIENT_ID }}" ] \
             && [ -n "${{ secrets.NAS_WATCHTOWER_TOKEN }}" ] \
             && [ -n "${{ vars.NAS_HOST }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "NAS 推送未配置(缺 TS_OAUTH_CLIENT_ID / NAS_WATCHTOWER_TOKEN / vars.NAS_HOST)。"
            echo "镜像已经推到 GHCR,NAS 会在下一次轮询时自己拉。"
          fi

      - name: Join the tailnet
        if: steps.check.outputs.ok == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Ask watchtower to update
        if: steps.check.outputs.ok == 'true'
        run: |
          set -e
          NAS="${{ vars.NAS_HOST }}"
          PORT="${{ vars.NAS_WATCHTOWER_PORT || '8080' }}"
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.NAS_WATCHTOWER_TOKEN }}" \
            "http://$NAS:$PORT/v1/update"
          echo

      - name: Wait for the NAS to serve the new image
        if: steps.check.outputs.ok == 'true'
        run: |
          NAS="${{ vars.NAS_HOST }}"
          PORT="${{ vars.NAS_APP_PORT || '3001' }}"
          # /api/health reads a row from BOTH SQLite files, so a green gate
          # here means the container came back with a usable database — not
          # merely that something is listening.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 "http://$NAS:$PORT/api/health" >/dev/null; then
              echo "NAS is serving the new image"; exit 0
            fi
            sleep 5
          done
          echo "NAS did not come back healthy within 200s" >&2
          exit 1
